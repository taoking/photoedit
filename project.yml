name: PhotoEdit
options:
  bundleIdPrefix: com.taoking
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) CI_SILENCE_GL_DEPRECATION=1"
    DEVELOPMENT_TEAM: ""
targets:
  PhotoEdit:
    type: application
    platform: iOS
    sources:
      - path: PhotoEdit
        excludes:
          - Resources/ImportedTestPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taoking.PhotoEdit
        INFOPLIST_FILE: PhotoEdit/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  PhotoEditTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PhotoEditTests
    dependencies:
      - target: PhotoEdit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taoking.PhotoEditTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoEdit.app/PhotoEdit"
        BUNDLE_LOADER: "$(TEST_HOST)"
  PhotoEditUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/PhotoEditUITests
    dependencies:
      - target: PhotoEdit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taoking.PhotoEditUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotoEdit
schemes:
  PhotoEdit:
    build:
      targets:
        PhotoEdit: all
        PhotoEditTests: [test]
        PhotoEditUITests: [test]
    test:
      targets:
        - PhotoEditTests
        - PhotoEditUITests
      gatherCoverageData: true
